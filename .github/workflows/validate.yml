name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  expo-apps:
    name: Expo apps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Verify Expo apps
        shell: bash
        run: |
          set -euo pipefail
          for app in expo/*; do
            if [[ ! -d "$app" ]]; then
              continue
            fi
            echo "::group::$app"
            (
              cd "$app"
              bun install
              bun run verify
            )
            echo "::endgroup::"
          done
