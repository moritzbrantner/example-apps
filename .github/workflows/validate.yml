name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-apps:
    name: Expo apps
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Download generated app lockfiles
        uses: actions/download-artifact@v5
        with:
          name: example-apps-bun-locks
          path: .artifacts/locks
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35041044063
      - name: Materialize generated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for lock in .artifacts/locks/*/bun.lock; do
            app="$(basename "$(dirname "$lock")")"
            test -f "expo/$app/package.json"
            cp "$lock" "expo/$app/bun.lock"
            count=$((count + 1))
          done
          test "$count" -eq 17
      - name: Commit generated lockfiles to the PR branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git add expo/*/bun.lock
          if git diff --cached --quiet; then
            echo "Generated lockfiles are already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock example app dependencies"
          git push origin "HEAD:$HEAD_REF"
