name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-apps:
    name: Expo apps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Generate app lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for app in expo/*; do
            if [[ ! -f "$app/package.json" ]]; then
              continue
            fi
            echo "::group::install $app"
            (cd "$app" && bun install)
            echo "::endgroup::"
          done
      - name: Test Expo apps
        run: bun run test
      - name: Typecheck Expo apps
        run: bun run typecheck
      - name: Build Expo apps
        run: bun run build
      - name: Upload generated app lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: example-apps-bun-locks
          path: expo/*/bun.lock
          if-no-files-found: error
