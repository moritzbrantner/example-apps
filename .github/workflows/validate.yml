name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  expo-converter:
    name: Expo converter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo/converter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        run: bun install
      - name: Verify app
        run: bun run verify
