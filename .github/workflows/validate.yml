name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  expo-apps:
    name: Expo apps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install workspace dependencies
        run: bun install
      - name: Test Expo apps
        run: bun run test
      - name: Typecheck Expo apps
        run: bun run typecheck
      - name: Build Expo apps
        run: bun run build
      - name: Upload generated workspace lockfile
        uses: actions/upload-artifact@v4
        with:
          name: example-apps-bun-lock
          path: bun.lock
          if-no-files-found: error
