name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-apps:
    name: Expo apps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install exact app dependencies
        shell: bash
        run: bash scripts/install-expo-apps.sh
      - name: Run coding-tooling fast tier
        uses: moritzbrantner/coding-tooling@9a1aaac5bd4aac7c0d78857f51dbcde41ed20cb1
        with:
          operation: run
          tier: fast
          bun-version: 1.3.12
          install-mode: none
          report-path: .artifacts/coding-tooling/fast.json
          strict: "true"
      - name: Preserve coding-tooling evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coding-tooling-fast-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/coding-tooling/fast.json
          if-no-files-found: error
          retention-days: 14

  pages:
    name: Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install exact app dependencies
        shell: bash
        run: bash scripts/install-expo-apps.sh
      - name: Build complete Pages artifact
        run: bun run verify:pages

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: ["expo-apps", "pages"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["expo-apps", "pages"]'
