name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-apps:
    name: Expo apps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install exact app dependencies
        shell: bash
        run: bash scripts/install-expo-apps.sh
      - name: Run coding-tooling fast tier
        uses: moritzbrantner/coding-tooling@9a1aaac5bd4aac7c0d78857f51dbcde41ed20cb1
        with:
          operation: run
          tier: fast
          bun-version: 1.3.12
          install-mode: none
          report-path: .artifacts/coding-tooling/fast.json
          strict: "true"
      - name: Preserve coding-tooling evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coding-tooling-fast-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/coding-tooling/fast.json
          if-no-files-found: error
          retention-days: 14
